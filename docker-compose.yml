# Production : docker compose up -d --build
name: reptile-shop

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    image: ${APP_IMAGE:-reptile-shop:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Rôle d'exécution limité au DML (voir deploy/postgres-init/10-app-role.sh).
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLAMAV_HOST: clamav
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]

  # Traitements asynchrones : e-mails, PDF de factures, antivirus, expirations, relances, alertes.
  worker:
    build: { context: ., target: worker }
    image: ${WORKER_IMAGE:-reptile-shop-worker:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Rôle d'exécution limité au DML (voir deploy/postgres-init/10-app-role.sh).
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLAMAV_HOST: clamav
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF : les travaux en file survivent à un redémarrage. noeviction : exigé par BullMQ.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Aucun port exposé.

  migrate:
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    # Aucun port exposé : base accessible uniquement depuis le réseau interne.

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: ["clamav_db:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      start_period: 300s
      retries: 5

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache rclone curl >/dev/null && echo \"${BACKUP_CRON:-30 3 * * *} /bin/sh /backup.sh >> /proc/1/fd/1 2>&1\" | crontab - && crond -f -l 8"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  clamav_db:
